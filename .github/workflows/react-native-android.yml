name: Build CampusOS React Native APK

on:
  push:
    branches: ["react-native-offline-migration"]
    paths:
      - "mobile/**"
      - ".github/workflows/react-native-android.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/react-native-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13"
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build ARM64 debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PreactNativeArchitectures=arm64-v8a
      - name: Verify APK manifest and signature
        working-directory: mobile
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/campusos-apk-badging.txt
          grep -q "package: name='com.kage049754.campusos'" /tmp/campusos-apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusOS-react-native-arm64-debug
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
