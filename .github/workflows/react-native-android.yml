name: Build CampusOS React Native APK

on:
  push:
    branches: ["react-native-offline-migration"]
    paths:
      - "mobile/**"
      - ".github/workflows/react-native-android.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/react-native-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusOS-react-native-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
