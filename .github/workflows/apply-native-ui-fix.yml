name: Apply native CampusOS UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: !contains(github.event.head_commit.message, 'Apply native CampusOS UI fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/kage049754/campusos/MainActivity.kt")
          s=p.read_text()
          s=s.replace("""listOf(
                            Screen.HOME,
                            Screen.CHAT,
                            Screen.ANNOUNCEMENTS,
                            Screen.SCHEDULE,
                            Screen.TASKS,
                            Screen.ACADEMICS
                        ).forEach {""","""listOf(
                            Screen.HOME,
                            Screen.SCHEDULE,
                            Screen.TASKS,
                            Screen.ACADEMICS
                        ).forEach {""")
          old='''if (screen == Screen.SCHEDULE) {
                                IconButton(onClick = { showScheduleDetails = true }) {
                                    Icon(Icons.Default.Info, "Subject details")
                                }
                            }
                            IconButton(onClick = { showHomeSettings = true }) {'''
          new='''IconButton(onClick = { screenName = Screen.CHAT.name }) {
                                Icon(Icons.Default.Chat, "Private group chats")
                            }
                            IconButton(onClick = { screenName = Screen.ANNOUNCEMENTS.name }) {
                                Icon(Icons.Default.Campaign, "Announcements")
                            }
                            if (screen == Screen.SCHEDULE) {
                                IconButton(onClick = { showScheduleDetails = true }) {
                                    Icon(Icons.Default.Info, "Subject details")
                                }
                            }
                            IconButton(onClick = { showHomeSettings = true }) {'''
          s=s.replace(old,new)
          s=s.replace('Screen.CHAT -> CampusWebEmbeddedScreen("https://kage049754.github.io/CampusOS-Web/?embed=android#chat")','Screen.CHAT -> NativeChatScreen()')
          s=s.replace('Screen.ANNOUNCEMENTS -> CampusWebEmbeddedScreen("https://kage049754.github.io/CampusOS-Web/?embed=android#announcements")','Screen.ANNOUNCEMENTS -> NativeAnnouncementsScreen()')
          s=s.replace('''fun CampusOSApp(activity: Activity) {
    val store = remember { LocalStore(activity) }''','''fun CampusOSApp(activity: Activity) {
    val store = remember { LocalStore(activity) }
    val authPrefs = remember { activity.getSharedPreferences("campusos_auth", Context.MODE_PRIVATE) }
    var campusSession by remember {
        mutableStateOf(authPrefs.getString("token", null)?.let {
            CampusSession(it, authPrefs.getString("uid", "") ?: "", authPrefs.getString("email", "") ?: "")
        })
    }''')
          s=s.replace('''MaterialTheme(colorScheme = colorScheme, shapes = CampusShapes) {
        if (subjectPageId != 0L) {''','''MaterialTheme(colorScheme = colorScheme, shapes = CampusShapes) {
        if (campusSession == null) {
            NativeLoginScreen { session ->
                authPrefs.edit()
                    .putString("token", session.accessToken)
                    .putString("uid", session.userId)
                    .putString("email", session.email)
                    .apply()
                campusSession = session
            }
            return@MaterialTheme
        }
        if (subjectPageId != 0L) {''')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/kage049754/campusos/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Apply native CampusOS UI fix"
          git push
